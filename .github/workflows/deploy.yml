# GitHub Pages deployment workflow for Vite
name: Build and Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and GitHub Releases
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code quality checks (Lint & Typecheck & Test)
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Build project
        run: npm run build

      - name: Set environment variables and detect build path
        id: build_env
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
          if [ -d "dist" ]; then
            echo "BUILD_PATH=dist" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "BUILD_PATH=build" >> $GITHUB_ENV
          elif [ -d "out" ]; then
            echo "BUILD_PATH=out" >> $GITHUB_ENV
          else
            echo "BUILD_PATH=dist" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './${{ env.BUILD_PATH }}'

      - name: Create release zip archive
        run: |
          ZIP_NAME="${{ github.event.repository.name }}-${{ env.BUILD_DATE }}-run${{ github.run_number }}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd "${{ env.BUILD_PATH }}" && zip -r "../${ZIP_NAME}" . && cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ env.BUILD_DATE }}-${{ github.run_number }}"
          gh release create "${TAG_NAME}" "${{ env.ZIP_NAME }}" \
            --title "${TAG_NAME}" \
            --generate-notes

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
