  <body>
    <script type="module" src="./src/index.ts"></script>
    <script type="text/javascript">
      function julesLog(eventName, data) {
        try {
          console.log(`[Jules Log] [DOM Event] [${eventName}]`, JSON.parse(JSON.stringify(data ?? {})));
        } catch (e) {
          console.log(`[Jules Log] [DOM Event] [${eventName}]`, data);
        }
      }

      function extractYouTubeVideoId(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return match && match[2].length === 11 ? match[2] : null;
      }

      let isBgmPlaying = false;

      function updateBgmButtonUI(playing) {
        const iconSpan = document.querySelector('#btnToggleBgmIcon');
        const btn = document.querySelector('#btnToggleBgm');
        if (iconSpan && btn) {
          iconSpan.textContent = playing ? '⏸' : '▶';
          btn.title = playing ? 'Pause BGM' : 'Play BGM';
        }
      }

      function playYouTubeAudio(rewind = true) {
        const urlInput = document.querySelector('#in_youtubeUrl');
        if (!urlInput) return;
        const url = urlInput.value.trim();
        const videoId = extractYouTubeVideoId(url);
        julesLog('YouTubeAudioPlayRequest', { url, videoId, rewind });
        if (!videoId) return;

        let iframe = document.querySelector('#yt-audio-iframe');
        if (!iframe) {
          const container = document.createElement('div');
          container.id = 'yt-audio-container';
          container.style.cssText =
            'display:none; position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none;';
          iframe = document.createElement('iframe');
          iframe.id = 'yt-audio-iframe';
          iframe.width = '1';
          iframe.height = '1';
          iframe.allow = 'autoplay';
          container.appendChild(iframe);
          document.body.appendChild(container);
        }

        if (rewind || !iframe.src || !iframe.src.includes(videoId)) {
          iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&start=0`;
        } else {
          iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        }

        isBgmPlaying = true;
        updateBgmButtonUI(true);
        julesLog('YouTubeAudioStarted', { videoId, src: iframe.src, isBgmPlaying: true });
      }

      function pauseYouTubeAudio() {
        julesLog('YouTubeAudioPauseRequest', {});
        const iframe = document.querySelector('#yt-audio-iframe');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }
        isBgmPlaying = false;
        updateBgmButtonUI(false);
        julesLog('YouTubeAudioPaused', { isBgmPlaying: false });
      }

      function stopYouTubeAudio() {
        const iframe = document.querySelector('#yt-audio-iframe');
        if (iframe) {
          julesLog('YouTubeAudioStopped', { src: iframe.src });
          iframe.src = '';
        }
        isBgmPlaying = false;
        updateBgmButtonUI(false);
      }

      function toggleYouTubeAudio() {
        julesLog('YouTubeAudioToggleClick', { currentState: isBgmPlaying });
        if (isBgmPlaying) {
          pauseYouTubeAudio();
        } else {
          playYouTubeAudio(false);
        }
      }

      function getNames() {
        const value = document.querySelector('#in_names').value.trim();
        return value
          .split(/[,\r\n]/g)
          .map((v) => v.trim())
          .filter((v) => !!v);
      }

      function parseName(nameStr) {
        const weightRegex = /(\/\d+)/;
        const countRegex = /(\*\d+)/;
        const hasWeight = weightRegex.test(nameStr);
        const hasCount = countRegex.test(nameStr);
        const name = /^\s*([^\/*]+)?/.exec(nameStr)[1];
        const weight = hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1;
        const count = hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1;
        return {
          name,
          weight,
          count,
        };
      }

      function getReady() {
        const names = getNames();
        window.roulette.setMarbles(names);
        ready = names.length > 0;
        localStorage.setItem('mbr_names', names.join(','));
        applyWinnerSetting();
        updateMarbleCounter(names);
        const btnStart = document.querySelector('#btnStart');
        if (btnStart) {
          btnStart.disabled = !ready;
        }
        julesLog('getReady', { namesCount: names.length, ready, winnerType });
      }

      function updateMarbleCounter(names) {
        let totalCount = 0;
        const uniqueParticipants = names.length;
        names.forEach((nameStr) => {
          const parsed = parseName(nameStr);
          if (parsed) {
            totalCount += parsed.count;
          }
        });
        const countElem = document.querySelector('#cnt_marbles');
        if (countElem) {
          const lang = window.getLanguage ? window.getLanguage() : 'ko';
          if (lang === 'ko') {
            countElem.textContent = `총 ${totalCount}개 구슬 (${uniqueParticipants}명)`;
          } else {
            countElem.textContent = `Total ${totalCount} marbles (${uniqueParticipants} participants)`;
          }
        }
      }

      // 구슬 수가 바뀔 때마다 다시 호출된다. 범위 클리핑은 roulette이 하고, 잘린 결과를 input에 되돌려 쓴다.
      // edited는 사용자가 방금 고친 범위 input('start' | 'end')
      function applyWinnerSetting(edited) {
        const rankInput = document.querySelector('#in_winningRank');
        const startInput = document.querySelector('#in_rangeStart');
        const endInput = document.querySelector('#in_rangeEnd');

        let start;
        let end;
        switch (winnerType) {
          case 'first':
            start = end = 1;
            break;
          case 'last':
            start = end = window.roulette.getCount();
            break;
          case 'multi':
            start = parseInt(startInput.value, 10) || 1;
            end = parseInt(endInput.value, 10) || 1;
            // 뒤집힌 범위는 방금 고친 쪽을 존중하고 반대쪽을 따라오게 한다
            if (end < start) {
              if (edited === 'end') {
                start = end;
              } else {
                end = start;
              }
            }
            break;
          default:
            start = end = parseInt(rankInput.value, 10) || 1;
        }

        window.roulette.setWinnerRange(start - 1, end - 1);
        const clipped = window.roulette.getWinnerRange();
        // 범위 input은 여러명 모드일 때만 건드린다. 다른 모드가 덮어쓰면 사용자가 넣어둔 범위가 날아간다
        if (winnerType === 'multi') {
          startInput.value = clipped.start + 1;
          endInput.value = clipped.end + 1;
        } else {
          rankInput.value = clipped.start + 1;
        }

        document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
        document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
        document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
        rankInput.classList.toggle('active', winnerType === 'custom');
        document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');

        julesLog('applyWinnerSetting', { winnerType, edited, clipped });
      }

      function selectWinnerType(type, edited) {
        julesLog('selectWinnerType', { previousType: winnerType, newType: type, edited });
        winnerType = type;
        applyWinnerSetting(edited);
      }

      let ready = false;
      let winnerType = 'last';

      document.addEventListener('DOMContentLoaded', () => {
        initialize();
      });

      function initialize() {
        if (!window.roulette || !window.roulette.isReady) {
          julesLog('InitializationPending', { readyState: false });
          setTimeout(initialize, 100);
          return;
        }
        julesLog('InitializationStart', { readyState: true });

        const savedYtUrl = localStorage.getItem('mbr_youtube_url') || 'https://www.youtube.com/watch?v=5qap5aO4i9A';
        const ytInput = document.querySelector('#in_youtubeUrl');
        if (ytInput) {
          ytInput.value = savedYtUrl;
          ytInput.addEventListener('input', (e) => {
            const val = e.target.value;
            localStorage.setItem('mbr_youtube_url', val);
            julesLog('YouTubeUrlInput', { value: val, videoId: extractYouTubeVideoId(val) });
          });
          ytInput.addEventListener('change', (e) => {
            const val = e.target.value;
            localStorage.setItem('mbr_youtube_url', val);
            julesLog('YouTubeUrlChange', { value: val, videoId: extractYouTubeVideoId(val) });
          });
        }

        const bgmToggleBtn = document.querySelector('#btnToggleBgm');
        if (bgmToggleBtn) {
          bgmToggleBtn.addEventListener('click', () => {
            toggleYouTubeAudio();
          });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const namesFromUrl = urlParams.get('names');

        if (namesFromUrl) {
          document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
        } else {
          const savedNames = localStorage.getItem('mbr_names');
          if (savedNames) {
            document.querySelector('#in_names').value = savedNames;
          }
        }
        document.querySelector('#in_names').addEventListener('input', () => {
          julesLog('InNamesInput', { rawValue: document.querySelector('#in_names').value });
          getReady();
        });

        document.querySelector('#in_names').addEventListener('blur', () => {
          const nameSource = getNames();
          const nameSet = new Set();
          const nameCounts = {};
          nameSource.forEach((nameSrc) => {
            const name = parseName(nameSrc);
            const key = name.weight > 1 ? `${name.name}/${name.weight}` : name.name;
            if (!nameSet.has(key)) {
              nameSet.add(key);
              nameCounts[key] = 0;
            }
            nameCounts[key] += name.count;
          });
          const result = [];
          Object.keys(nameCounts).forEach((key) => {
            if (nameCounts[key] > 1) {
              result.push(`${key}*${nameCounts[key]}`);
            } else {
              result.push(key);
            }
          });

          const oldValue = document.querySelector('#in_names').value;
          const newValue = result.join(',');

          julesLog('InNamesBlur', { oldValue, newValue });

          if (oldValue !== newValue) {
            document.querySelector('#in_names').value = newValue;
            getReady();
          }
        });

        document.querySelector('#btnShuffle').addEventListener('click', () => {
          julesLog('BtnShuffleClick', { currentNames: getNames() });
          stopYouTubeAudio();
          getReady();
        });

        document.querySelector('#btnReset').addEventListener('click', () => {
          julesLog('BtnResetClick', { currentNames: getNames() });
          stopYouTubeAudio();
          getReady();
        });

        document.querySelector('#btnStart').addEventListener('click', (e) => {
          julesLog('BtnStartClick', {
            ready,
            isRunning: window.roulette ? window.roulette.isRunning : false,
            winnerType,
          });
          if (!ready || (window.roulette && window.roulette.isRunning)) return;
          const btn = e.currentTarget;
          if (btn) btn.disabled = true;
          document.querySelector('#settings').classList.add('hide');
          playYouTubeAudio(true);
          window.roulette.start();
        });

        document.querySelector('#chkAutoRecording').addEventListener('change', (e) => {
          window.options.autoRecording = e.target.matches(':checked');
          julesLog('ChkAutoRecordingChange', { checked: window.options.autoRecording });
          window.roulette.setAutoRecording(window.options.autoRecording);
        });

        document.querySelector('#chkSkill').addEventListener('change', (e) => {
          window.options.useSkills = e.target.matches(':checked');
          julesLog('ChkSkillChange', { checked: window.options.useSkills });
        });

        document.querySelector('#chkSound').addEventListener('change', (e) => {
          window.options.soundEnabled = e.target.matches(':checked');
          julesLog('ChkSoundChange', { checked: window.options.soundEnabled });
          if (window.roulette && window.roulette.soundManager) {
            window.roulette.soundManager.setEnabled(window.options.soundEnabled);
          }
        });

        document.querySelector('#chkDarkMode').addEventListener('change', (e) => {
          window.options.darkMode = e.target.matches(':checked');
          julesLog('ChkDarkModeChange', { checked: window.options.darkMode });
          window.roulette.setTheme(window.options.darkMode ? 'dark' : 'light');
          document.documentElement.classList.toggle('light', !window.options.darkMode);
        });

        document.querySelector('#in_winningRank').addEventListener('change', (e) => {
          julesLog('InWinningRankChange', { value: e.target.value });
          selectWinnerType('custom');
        });
        document.querySelector('.btn-last-winner').addEventListener('click', () => {
          julesLog('BtnLastWinnerClick', {});
          selectWinnerType('last');
        });
        document.querySelector('.btn-first-winner').addEventListener('click', () => {
          julesLog('BtnFirstWinnerClick', {});
          selectWinnerType('first');
        });
        document.querySelector('.btn-multi-winner').addEventListener('click', () => {
          julesLog('BtnMultiWinnerClick', {});
          selectWinnerType('multi');
        });
        document.querySelector('#in_rangeStart').addEventListener('change', (e) => {
          julesLog('InRangeStartChange', { value: e.target.value });
          selectWinnerType('multi', 'start');
        });
        document.querySelector('#in_rangeEnd').addEventListener('change', (e) => {
          julesLog('InRangeEndChange', { value: e.target.value });
          selectWinnerType('multi', 'end');
        });

        window.roulette.addEventListener('goal', (e) => {
          julesLog('RouletteGoalEvent', e.detail);
          ready = false;
          setTimeout(() => {
            getReady();
            document.querySelector('#settings').classList.remove('hide');
          }, 3000);
        });

        window.roulette.addEventListener('message', (e) => {
          julesLog('RouletteMessageEvent', e.detail);
          simpleToast(e.detail);
        });

        const toggleBtn = document.querySelector('#btnToggleSettings');
        const collapsible = document.querySelector('.collapsible-rows');
        toggleBtn.addEventListener('click', () => {
          collapsible.classList.toggle('collapsed');
          const isCollapsed = collapsible.classList.contains('collapsed');
          julesLog('BtnToggleSettingsClick', { collapsed: isCollapsed });
          toggleBtn.querySelector('.toggle-arrow').textContent = isCollapsed ? '▲' : '▼';
        });

        document.querySelector('#btnShuffle').click();

        const maps = window.roulette.getMaps();
        const mapSelector = document.querySelector('#sltMap');
        maps.forEach((map) => {
          const option = document.createElement('option');
          option.value = map.index;
          option.innerHTML = map.title;
          option.setAttribute('data-trans', '');
          window.translateElement(option);
          mapSelector.append(option);
        });
        mapSelector.addEventListener('change', (e) => {
          julesLog('SltMapChange', { selectedIndex: e.target.value });
          window.roulette.setMap(e.target.value);
          getReady();
        });

        function simpleToast(msg) {
          julesLog('SimpleToastShow', { msg });
          const toast = document.createElement('div');
          toast.classList.add('toast');
          toast.innerHTML = msg;

          if (window.translateElement) {
            window.translateElement(toast);
          }

          document.body.appendChild(toast);
          setTimeout(() => {
            document.body.removeChild(toast);
          }, 1200);
        }
      }
    </script>
    <h1 class="sr-only">Marble Roulette - 랜덤 추첨기</h1>
    <div id="settings" class="settings">
      <div class="right">
        <button id="btnToggleSettings" class="btn-toggle-settings" title="Settings" data-trans="title">
          <span data-trans>Settings</span>
          <i class="toggle-arrow">▲</i>
        </button>
        <div class="collapsible-rows collapsed">
          <div class="row">
            <label for="sltMap">
              <i class="icon map"></i>
              <span data-trans>Map</span>
            </label>
            <select id="sltMap" title="Map" data-trans="title"></select>
          </div>
          <div class="row row-youtube">
            <label for="in_youtubeUrl">
              <i class="icon play"></i>
              <span>BGM (YouTube)</span>
            </label>
            <div style="display: flex; flex: 1; gap: 6px; align-items: center; min-width: 0">
              <input
                type="text"
                id="in_youtubeUrl"
                placeholder="YouTube URL..."
                title="YouTube BGM Link"
                style="
                  height: 32px;
                  flex: 1;
                  min-width: 0;
                  border-radius: 8px;
                  background: rgba(10, 14, 23, 0.65);
                  border: 1px solid rgba(255, 255, 255, 0.12);
                  color: #f8fafc;
                  padding: 0 10px;
                  font-size: 12px;
                  outline: none;
                "
              />
              <button
                id="btnToggleBgm"
                type="button"
                title="Play/Pause BGM"
                style="
                  height: 32px;
                  padding: 0 10px;
                  flex-shrink: 0;
                  border-radius: 8px;
                  background: rgba(30, 41, 59, 0.8);
                  border: 1px solid rgba(255, 255, 255, 0.12);
                  color: #ffffff;
                  cursor: pointer;
                  font-size: 12px;
                "
              >
                <span id="btnToggleBgmIcon">▶</span>
              </button>
            </div>
          </div>
          <div class="row row-toggles">
            <div class="toggle-item">
              <label for="chkAutoRecording">
                <i class="icon record"></i>
                <span data-trans>Recording</span>
              </label>
              <input type="checkbox" id="chkAutoRecording" />
            </div>
            <div class="toggle-item">
              <label for="chkSkill">
                <i class="icon bomb"></i>
                <span data-trans>Using skills</span>
              </label>
              <input type="checkbox" id="chkSkill" checked />
            </div>
            <div class="toggle-item">
              <label for="chkSound">
                <i class="icon sound"></i>
                <span data-trans>Sound</span>
              </label>
              <input type="checkbox" id="chkSound" checked />
            </div>
          </div>
          <div class="row">
            <label>
              <i class="icon trophy"></i>
              <span data-trans>The winner is</span>
            </label>
            <div class="btn-group">
              <button class="btn-winner btn-first-winner" data-trans>First</button>
              <button class="btn-winner btn-last-winner active" data-trans>Last</button>
              <input type="number" id="in_winningRank" value="1" min="1" title="Winning Rank" data-trans="title" />
              <button class="btn-winner btn-multi-winner" data-trans>Multiple</button>
            </div>
          </div>
          <div class="row row-range">
            <label></label>
            <div class="btn-group range-group">
              <input type="number" id="in_rangeStart" value="1" min="1" title="Start Rank" data-trans="title" />
              <span class="range-sep">~</span>
              <input type="number" id="in_rangeEnd" value="3" min="1" title="End Rank" data-trans="title" />
            </div>
          </div>
          <div class="row row-theme">
            <div class="theme" title="Theme" data-trans="title">
              <i class="icon sun"></i>
              <input type="checkbox" id="chkDarkMode" checked />
              <i class="icon moon"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="left">
        <div class="left-header">
          <h3 data-trans>Enter names below</h3>
          <span id="cnt_marbles" class="marble-count-badge"></span>
        </div>
        <textarea
          id="in_names"
          placeholder="Input names separated by commas or line feed here"
          data-trans="placeholder"
        >
수박*2,키위*2,귤*2</textarea>
        <div class="input-syntax-tip" data-trans>Marbles Syntax Tip</div>
        <div class="actions">
          <button id="btnShuffle" title="Shuffle" data-trans="title">
            <i class="icon shuffle"></i>
            <span data-trans>Shuffle</span>
          </button>
          <button id="btnReset" title="Reset" data-trans="title">
            <i class="icon reset"></i>
            <span data-trans>Reset</span>
          </button>
          <button id="btnStart" title="Start" data-trans="title">
            <i class="icon play"></i>
            <span data-trans>Start</span>
          </button>
        </div>
      </div>
    </div>
